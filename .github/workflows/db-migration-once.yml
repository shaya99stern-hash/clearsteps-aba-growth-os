name: Generate initial Postgres migration once

on:
  push:
    branches:
      - feat/clearsteps-intelligence-os-v1
    paths:
      - .github/db-migration-trigger

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://clearsteps:clearsteps@127.0.0.1:5432/clearsteps

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/clearsteps-intelligence-os-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate baseline migration
        run: |
          rm -rf prisma/migrations
          mkdir -p prisma/migrations/20260828045500_init
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script -o prisma/migrations/20260828045500_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml

      - name: Commit migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "Add initial Postgres migration"
          git push origin HEAD:feat/clearsteps-intelligence-os-v1
