name: Verify Playwright Browser

on:
  pull_request:
    paths:
      - "lib/intelligence/browser-collector.ts"
      - "lib/intelligence/network-safety.ts"
      - "app/**/*.tsx"
      - "app/**/*.css"
      - "components/**/*.tsx"
      - "components/**/*.css"
      - "scripts/verify-browser.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-browser.yml"
  push:
    branches:
      - feat/clearsteps-intelligence-os-v1
      - feat/clearsteps-intelligence-os-v2
    paths:
      - "lib/intelligence/browser-collector.ts"
      - "lib/intelligence/network-safety.ts"
      - "app/**/*.tsx"
      - "app/**/*.css"
      - "components/**/*.tsx"
      - "components/**/*.css"
      - "scripts/verify-browser.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-browser.yml"

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEARSTEPS_UI_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium shell
        run: npm run browser:install

      - name: Start Clear Steps
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/clearsteps-next.log 2>&1 &
          echo $! > /tmp/clearsteps-next.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/outreach > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clearsteps-next.log
          exit 1

      - name: Launch Chromium and verify Clear Steps UI
        run: npm run verify:browser

      - name: Show app log on failure
        if: failure()
        run: cat /tmp/clearsteps-next.log || true
