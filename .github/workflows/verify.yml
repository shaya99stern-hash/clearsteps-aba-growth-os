name: Verify Clear Steps

on:
  pull_request:
  push:
    branches:
      - feat/clearsteps-intelligence-os-v1
      - feat/clearsteps-intelligence-os-v2
      - feat/clearsteps-aba-engine-v3
      - feat/clearsteps-aba-engine-v4
      - feat/clearsteps-aba-engine-v5

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://clearsteps:clearsteps@127.0.0.1:5432/clearsteps
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        id: production_audit
        continue-on-error: true
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          const v = report.metadata?.vulnerabilities ?? {};
          console.log(`Production dependency audit: critical=${v.critical ?? 0} high=${v.high ?? 0} moderate=${v.moderate ?? 0} low=${v.low ?? 0}`);
          NODE

      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-production
          path: npm-audit-production.json
          if-no-files-found: error

      - name: Verify intelligence rules
        run: npm run verify:intelligence

      - name: Verify Phase 3 ABA Engine rules
        run: npm run verify:aba-engine

      - name: Verify Colorado and cross-source public indicators
        run: npm run verify:colorado-signals

      - name: Verify Colorado public ecosystem never becomes client leads
        run: npm run verify:colorado-networks

      - name: Verify evidence graph and no-key source mesh
        run: npm run verify:evidence-mesh

      - name: Verify publisher, geography and source narrative precision
        run: npm run verify:evidence-precision

      - name: Verify adaptive cross-reference of weak institutional signals
        run: npm run verify:adaptive-followup

      - name: Verify public organization contact follow-up
        run: npm run verify:institutional-followup

      - name: Verify family acquisition and staffing readiness
        run: npm run verify:client-growth

      - name: Verify safe family contact activation
        run: npm run verify:family-contact

      - name: Verify age 2–18 tripled source mesh
        run: npm run verify:age-2-18

      - name: Verify independent provider review discovery
        run: npm run verify:provider-reputation

      - name: Verify youth age groups and organizational referral qualification
        run: npm run verify:youth-qualification

      - name: Smoke real keyless upstream data feeds (non-gating)
        continue-on-error: true
        run: npm run smoke:live-acquisition

      - name: Verify Missouri/Kansas state sources
        run: npx tsx scripts/verify-state-sources.ts

      - name: Verify Kansas KDHE runtime collector
        run: npx tsx scripts/verify-kansas-runtime.ts

      - name: Verify Scout state-source routing
        run: npx tsx scripts/verify-scout-state-routing.ts

      - name: Verify Scout research persistence
        run: npx tsx scripts/verify-research-persistence.ts

      - name: Verify task rules
        run: npx tsx scripts/verify-tasks.ts

      - name: Verify Scout command center decisions
        run: npm run verify:command-center

      - name: Verify outreach rules
        run: npx tsx scripts/verify-outreach.ts

      - name: Verify local-first reconciliation
        run: npx tsx scripts/verify-local-first-sync.ts

      - name: Verify CRM workspace rules
        run: npx tsx scripts/verify-crm-workspace.ts

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint changed source files
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs')
          if [ ${#files[@]} -eq 0 ]; then
            echo '[]' > lint-results.json
          else
            npx eslint "${files[@]}" --format json --output-file lint-results.json
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results.json
          if-no-files-found: ignore

      - name: Build
        id: build
        if: steps.lint.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: build.log
          if-no-files-found: ignore

      - name: Enforce lint gate
        if: steps.lint.outcome == 'failure'
        run: |
          node -e 'const r=require("./lint-results.json"); const bad=r.filter(x=>x.errorCount||x.warningCount); for(const f of bad){console.error(f.filePath,"errors="+f.errorCount,"warnings="+f.warningCount);for(const m of f.messages||[]) console.error("  line "+m.line+":"+m.column, m.ruleId+":",m.message)} if(bad.length)process.exit(1)'

      - name: Enforce build gate
        if: steps.lint.outcome == 'success' && steps.build.outcome == 'failure'
        run: |
          tail -n 120 build.log
          exit 1
