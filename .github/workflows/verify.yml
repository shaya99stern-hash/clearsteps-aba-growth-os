name: Verify Clear Steps

on:
  pull_request:
  push:
    branches:
      - feat/clearsteps-intelligence-os-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify intelligence rules
        run: npm run verify:intelligence

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        id: lint
        continue-on-error: true
        run: npx eslint . --format json --output-file lint-results.json

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results.json
          if-no-files-found: ignore

      - name: Build
        if: steps.lint.outcome == 'success'
        run: npm run build

      - name: Enforce lint gate
        if: steps.lint.outcome == 'failure'
        run: |
          node -e 'const r=require("./lint-results.json"); for (const f of r.filter(x=>x.errorCount||x.warningCount)) console.error(f.filePath, "errors="+f.errorCount, "warnings="+f.warningCount); process.exit(1)'
