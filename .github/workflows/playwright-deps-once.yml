name: Add Playwright dependency once

on:
  push:
    branches:
      - feat/clearsteps-intelligence-os-v1
    paths:
      - .github/playwright-deps-trigger

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/clearsteps-intelligence-os-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add Playwright library and scripts
        run: |
          npm install playwright@1.62.1 --save
          npm pkg set scripts.browser:install="playwright install --with-deps --only-shell chromium"
          npm pkg set scripts.verify:browser="tsx scripts/verify-browser.ts"

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Playwright browser runtime dependency"
          git push origin HEAD:feat/clearsteps-intelligence-os-v1
